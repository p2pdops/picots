name: 🐛 Bug Report
description: Create a report to help us improve PicoTS
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: PicoTS Version
      description: What version of PicoTS are you using?
      placeholder: e.g. 0.0.6
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Ubuntu/Debian)
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or minimal repository to reproduce the behavior.
      placeholder: |
        1. bunx @picots/create my-app
        2. bun run dev
        3. See error...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Error Output
      description: Copy and paste any relevant terminal output or crash logs.
      render: shell
